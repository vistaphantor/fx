name: Language Reasoner Checks

on:
  push:
    paths:
      - "src/language/**"
      - "corpus/**"
      - "tools/train_language_reasoner.py"
      - "tools/vista_chat.py"
      - "tests/test_language_*.py"
      - "requirements.txt"
      - ".github/workflows/language-reasoner-checks.yml"
  pull_request:
    paths:
      - "src/language/**"
      - "corpus/**"
      - "tools/train_language_reasoner.py"
      - "tools/vista_chat.py"
      - "tests/test_language_*.py"
      - "requirements.txt"

jobs:
  language-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install language dependencies
        run: python -m pip install --upgrade pip pytest torch datasets
      - name: Compile authoritative language modules
        run: |
          python -m compileall -q src/language corpus tools/train_language_reasoner.py tools/vista_chat.py
      - name: Import authoritative training stack
        run: |
          python -c "import corpus.streamer; import corpus.manager; import tools.train_language_reasoner"
      - name: Run language architecture tests
        run: |
          python -m pytest \
            tests/test_language_architecture.py \
            tests/test_language_data_pipeline.py \
            tests/test_language_model_alignment.py \
            tests/test_language_tokenizer_semantics.py \
            tests/test_language_tokenizer_v4.py \
            tests/test_language_training_pipeline.py \
            tests/test_language_training_budget.py \
            tests/test_language_long_reasoning.py \
            tests/test_language_curriculum.py \
            tests/test_language_protocol.py \
            tests/test_language_generation.py \
            tests/test_language_epoch_exam.py \
            tests/test_language_generated_bytes.py \
            tests/test_language_streaming_sources.py \
            tests/test_language_dedup.py \
            tests/test_language_compute_budget.py \
            tests/test_language_source_contract.py \
            -q
